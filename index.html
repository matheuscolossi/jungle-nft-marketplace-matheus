<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#140d0a" />
    <meta
      name="description"
      content="KURIO: descubra arte digital, explore coleções e experimente a jornada de um colecionador em um marketplace demonstrativo de NFTs."
    />
    <title>KURIO — Arte digital para colecionar</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/roboto-mono-latin-variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      if (["/", "/login", "/register"].includes(window.location.pathname)) {
        const heroAsset = document.createElement("link");
        heroAsset.rel = "preload";
        heroAsset.as = "image";
        heroAsset.href = "/assets/figma/hero-ape.webp";
        heroAsset.fetchPriority = "high";
        document.head.appendChild(heroAsset);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
